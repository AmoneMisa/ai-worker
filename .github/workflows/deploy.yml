name: Build and deploy ai-worker

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-worker-production
  cancel-in-progress: true

jobs:
  build-deploy:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ai-worker
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ai-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amonemisa/ai-worker:latest
            ghcr.io/amonemisa/ai-worker:${{ github.sha }}
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,mode=max,scope=ai-worker

      - name: Build and push translator
        uses: docker/build-push-action@v6
        with:
          context: ./translator
          push: true
          tags: |
            ghcr.io/amonemisa/ai-worker-translator:latest
            ghcr.io/amonemisa/ai-worker-translator:${{ github.sha }}
          cache-from: type=gha,scope=ai-worker-translator
          cache-to: type=gha,mode=max,scope=ai-worker-translator

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd ~/opt/ai-worker
            git pull --ff-only
            bash deploy.sh
            docker logout ghcr.io
