name: CI, build and deploy ai-worker

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate ai-worker
        run: |
          npm run check
          npm test
          bash -n deploy.sh

      - name: Validate Compose bootstrap
        run: docker compose config --quiet

      - name: Smoke test FreeLLMAPI bootstrap
        shell: bash
        run: |
          set -euo pipefail
          export FREELLMAPI_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          docker network inspect ai-net >/dev/null 2>&1 || docker network create ai-net
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose up -d freellmapi

          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$(docker compose ps -q freellmapi)")"
            if [[ "$status" == "healthy" ]]; then
              docker compose exec -T freellmapi sh -c 'test -s /app/server/data/unified.key'
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs freellmapi
              exit 1
            fi
            sleep 2
          done

          docker compose logs freellmapi
          echo "FreeLLMAPI did not become healthy." >&2
          exit 1

  changes:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      ai_worker: ${{ steps.detect.outputs.ai_worker }}
      compose: ${{ steps.detect.outputs.compose }}
      deploy_script: ${{ steps.detect.outputs.deploy_script }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          ai_worker=false
          compose=false
          deploy_script=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            ai_worker=true
            compose=true
            deploy_script=true
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                Dockerfile|.dockerignore|package.json|package-lock.json|src/*)
                  ai_worker=true
                  ;;
              esac

              case "$file" in
                docker-compose.yml)
                  compose=true
                  ;;
                deploy.sh)
                  deploy_script=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi

          echo "ai_worker=$ai_worker" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "deploy_script=$deploy_script" >> "$GITHUB_OUTPUT"

          printf 'ai-worker image: %s\ncompose config: %s\ndeploy script: %s\n' \
            "$ai_worker" "$compose" "$deploy_script"

  build-deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (needs.changes.outputs.ai_worker == 'true' ||
       needs.changes.outputs.compose == 'true' ||
       needs.changes.outputs.deploy_script == 'true')
    needs: [test, changes]
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.ai_worker == 'true'

      - name: Log in to GHCR
        if: needs.changes.outputs.ai_worker == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ai-worker
        if: needs.changes.outputs.ai_worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amonemisa/ai-worker:latest
            ghcr.io/amonemisa/ai-worker:${{ github.sha }}
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,mode=max,scope=ai-worker

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd ~/opt/ai-worker
            git pull --ff-only
            SKIP_GIT_PULL=true \
              AI_WORKER_CHANGED='${{ needs.changes.outputs.ai_worker }}' \
              DEPLOY_CONFIG_CHANGED='${{ needs.changes.outputs.compose }}' \
              bash deploy.sh
            docker logout ghcr.io
