name: AI worker branch check

on:
  push:
    branches: [ feat/translation-priority-metrics ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m py_compile translator/app.py
      - run: docker build -t ai-translator-check ./translator
