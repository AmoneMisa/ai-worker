services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ${OLLAMA_DATA_PATH:-ollama-data}:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    networks: [ internal ]
    cpus: "${OLLAMA_CPUS:-4.0}"
    mem_limit: "${OLLAMA_MEMORY_LIMIT:-8g}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: ollama/ollama
    profiles: [ setup ]
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${AI_MODEL:-qwen3.5:2b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [ internal ]

  translator:
    image: ${TRANSLATOR_IMAGE:-ghcr.io/amonemisa/ai-worker-translator:latest}
    restart: unless-stopped
    init: true
    environment:
      - TRANSLATOR_THREADS=${TRANSLATOR_THREADS:-2}
      - TRANSLATOR_MAX_SOURCE_TOKENS=${TRANSLATOR_MAX_SOURCE_TOKENS:-420}
      - OMP_NUM_THREADS=${TRANSLATOR_THREADS:-2}
    networks: [ internal ]
    cpus: "${TRANSLATOR_CPUS:-1.5}"
    mem_limit: "${TRANSLATOR_MEMORY_LIMIT:-2g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4040/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-worker:
    image: ${AI_WORKER_IMAGE:-ghcr.io/amonemisa/ai-worker:latest}
    restart: unless-stopped
    init: true
    environment:
      - OLLAMA_URL=http://ollama:11434
      - TRANSLATION_URL=http://translator:4040
      - TRANSLATION_SERVICE_TIMEOUT_MS=${TRANSLATION_SERVICE_TIMEOUT_MS:-30000}
      - TRANSLATION_FALLBACK_TO_QWEN=${TRANSLATION_FALLBACK_TO_QWEN:-true}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_TEXT_ENABLED=${AI_TEXT_ENABLED:-true}
      - AI_VISION_ENABLED=${AI_VISION_ENABLED:-false}
      - AI_OCR_ENABLED=${AI_OCR_ENABLED:-false}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-qwen3.5:2b}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-qwen3.5:2b}
      - AI_THINK=${AI_THINK:-false}
      - AI_CONCURRENCY=${AI_CONCURRENCY:-1}
      - AI_TEXT_CONTEXT=${AI_TEXT_CONTEXT:-8192}
      - AI_IMAGE_CONTEXT=${AI_IMAGE_CONTEXT:-4096}
      - AI_TEXT_TIMEOUT_MS=${AI_TEXT_TIMEOUT_MS:-120000}
      - AI_TRANSLATION_TIMEOUT_MS=${AI_TRANSLATION_TIMEOUT_MS:-180000}
      - AI_IMAGE_TIMEOUT_MS=${AI_IMAGE_TIMEOUT_MS:-300000}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-1}
      - AI_MIN_CONFIDENCE=${AI_MIN_CONFIDENCE:-0.6}
      - AI_MAX_TEXT_CHARS=${AI_MAX_TEXT_CHARS:-32000}
      - AI_MAX_PHOTOS_PER_LISTING=${AI_MAX_PHOTOS_PER_LISTING:-4}
      - AI_IMAGE_MAX_WIDTH=${AI_IMAGE_MAX_WIDTH:-1280}
      - AI_IMAGE_MAX_HEIGHT=${AI_IMAGE_MAX_HEIGHT:-1280}
      - VISION_PROVIDERS=${VISION_PROVIDERS:-groq,cloudflare}
      - VISION_CONCURRENCY=${VISION_CONCURRENCY:-1}
      - VISION_PROVIDER_TIMEOUT_MS=${VISION_PROVIDER_TIMEOUT_MS:-30000}
      - VISION_COOLDOWN_MS=${VISION_COOLDOWN_MS:-300000}
      - VISION_CACHE_TTL_MS=${VISION_CACHE_TTL_MS:-2592000000}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_VISION_MODEL=${CLOUDFLARE_VISION_MODEL:-@cf/meta/llama-3.2-11b-vision-instruct}
      - PROMPT_VERSION=${PROMPT_VERSION:-1}
      - SCHEMA_VERSION=${SCHEMA_VERSION:-3}
      - AI_CACHE_TTL_MS=${AI_CACHE_TTL_MS:-86400000}
      - AI_TRANSLATION_CACHE_TTL_MS=${AI_TRANSLATION_CACHE_TTL_MS:-604800000}
    depends_on:
      ollama:
        condition: service_healthy
      translator:
        condition: service_healthy
    networks: [ internal, ai-net ]
    ports:
      - "127.0.0.1:4030:4030"
    mem_limit: "${AI_WORKER_MEMORY_LIMIT:-1g}"
    cpus: "${AI_WORKER_CPUS:-0.5}"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4030/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ollama-data:

networks:
  internal:
  ai-net:
    external: true
